name: Update Yearly GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_github_stats.py"
      - ".github/workflows/update-github-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate yearly statistics
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/update_github_stats.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/yearly-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update yearly GitHub statistics"
            git push
          else
            echo "Statistics are already up to date."
          fi